[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentrux"
version = "0.1.1"
description = "Structural quality analysis and governance tool for AI-assisted code development"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Sentrux Contributors"}
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "black>=26.0", "ruff>=0.1.0"]
test = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
sentrux = "sentrux.cli.main:main"

[tool.setuptools]
packages = ["sentrux", "sentrux.cli", "sentrux.core", "sentrux.mcp", "sentrux.models", "sentrux.utils"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=sentrux --cov-report=term"
