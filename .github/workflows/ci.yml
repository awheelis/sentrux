name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Lint with ruff
        run: |
          uv run ruff check sentrux tests

      - name: Format check with black
        # black 26.x (3.10+) and black 25.x (3.9) have incompatible stable styles;
        # skip on 3.9 to avoid false failures unrelated to code correctness
        if: matrix.python-version != '3.9'
        run: |
          uv run black --check sentrux tests

      - name: Run tests
        run: |
          uv run pytest tests/ -v --cov=sentrux

      - name: Test CLI
        run: |
          uv run sentrux scan .
          uv run sentrux check .
