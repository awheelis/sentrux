name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Lint with ruff
        run: |
          uv run ruff check sentrux tests

      - name: Format check with black
        run: |
          uv run black --check sentrux tests

      - name: Run tests
        run: |
          uv run pytest tests/ -v --cov=sentrux

      - name: Test CLI
        run: |
          uv run sentrux scan .
          uv run sentrux check .

      - name: Test MCP server
        run: |
          echo '{"method":"initialize","params":{"workspace":"."}}' | uv run sentrux --mcp | python -c "import sys,json; d=json.load(sys.stdin); assert 'serverInfo' in d, f'unexpected: {d}'"
          echo '{"method":"tools/list","params":{}}' | uv run sentrux --mcp | python -c "import sys,json; d=json.load(sys.stdin); assert 'tools' in d and len(d['tools']) > 0"
